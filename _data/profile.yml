short_bio: >-
  <p>
    Hi! I'm an industrial PhD researcher at TU Berlin and Huawei Munich Research Center,
    working with Prof. Stefan Schmid and Dr. Yong Li.
  </p>
  <p>
    I work on <strong>LLM agent security</strong> and <strong>privacy-preserving machine learning</strong>.
    I'm interested in how agents can use tools safely, stay within the permissions users give them, and keep sensitive data private.
    My work also covers secure LLM inference and private retrieval-augmented generation.
  </p>
  <p>
    Before my PhD, I studied at KTH Royal Institute of Technology and Southeast University.
    I also worked on security at Huawei 2012 Labs and did my master's thesis at Ericsson in Stockholm.
    Outside research, I enjoy traveling and taking photos.
  </p>

